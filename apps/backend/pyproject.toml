[project]
name = "echomemory-backend"
version = "0.1.0"
description = "EchoMemory backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "redis",
    "langchain",
    "langgraph",
    "passlib",
    "python-jose",
    "bcrypt<4.0",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
