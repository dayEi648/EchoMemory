[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echomemory-backend"
version = "0.1.0"
description = "EchoMemory backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "asyncpg",
    "redis",
    "langchain",
    "langgraph",
    "passlib",
    "python-jose",
    "bcrypt<4.0",
    "email-validator",
    "oss2",
    "Pillow",
    "python-multipart",
    "openai>=2.41.1",
    "pgvector>=0.4.2",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[project.scripts]
start = "echomemory_backend.cli:start"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx2",
    "fakeredis",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
