version: "3.8"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: echomemory-postgres
    environment:
      POSTGRES_USER: echomemory
      POSTGRES_PASSWORD: echomemory
      POSTGRES_DB: echomemory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: echomemory-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
