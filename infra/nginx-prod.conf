# 生产环境 Nginx 配置
# 只代理 API 请求到后端，前端是 Tauri 桌面应用，不走 Nginx

worker_processes  auto;

error_log  /var/log/nginx/echomemory-error.log;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 后端 upstream（支持多实例部署时扩展）
    upstream echomemory_backend {
        server 127.0.0.1:8000;
        # 未来可添加更多后端实例：
        # server 127.0.0.1:8001;
    }

    server {
        listen       80;
        server_name  _;  # 接受任意域名，或改为你的真实域名

        # 强制 HTTPS（生产环境建议开启）
        # return 301 https://$host$request_uri;

        # 健康检查
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API 代理到后端 FastAPI
        location /api/ {
            proxy_pass http://echomemory_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 增加超时设置（后端可能有长时间运行的 AI 接口）
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # 静态文件（如上传文件代理）
        location /static/ {
            alias /var/www/echomemory/static/;
            expires 7d;
        }
    }

    # HTTPS 配置（申请证书后启用）
    # server {
    #     listen       443 ssl http2;
    #     server_name  api.echomemory.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/echomemory.crt;
    #     ssl_certificate_key /etc/nginx/ssl/echomemory.key;
    #
    #     location /api/ {
    #         proxy_pass http://echomemory_backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
